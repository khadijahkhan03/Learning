<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="wrapper" >
        <form id="signup-form" action="regSuccess.html" method="get">
            <h1>Sign Up</h1>
            <div class="input-box">
                <input type="text" placeholder="Enter name" id="name" required>
            </div>
            <div class="input-box">
                <input type="text" placeholder="Enter username" id="username" required>
            </div>
            <div class="input-box">
                <input type="email" placeholder="Enter email" id="email" required>
            </div>
            <div class="input-box">
                <input type="password" placeholder="Enter password" pattern= "(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" id="password" required>
            </div>
            <div class="passReq">
                <p>Password must contain:</p>
                <ul>
                    <li>A lowercase letter</li>
                    <li>An uppercase letter</li>
                    <li>A number</li>
                    <li>At least 8 characters</li>
                </ul>
            </div>
            <br>
            <div class="remeber-forgot">
                <label><input type="checkbox"> Remeber Me</label>
            </div>
            <a href="regSuccess.html">
                <button type="submit" class="btn">Register</button>
            </a>
        </form>        
    </div>

    <!-- writing JS code within HTML file -->
    <script>        
        const form = document.getElementById('signup-form');
        
        form.addEventListener('submit', function(event) {
        //Prevent the default form submission by browser
        event.preventDefault();

            const name = document.getElementById('name').value;
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const userData = {
                name: name,
                username: username,
                email: email,
                password: password
            };

        //Saving to local storage
        const userDataString = JSON.stringify(userData);        // Convert JS object to a JSON string
        localStorage.setItem('userFormData', userDataString);

         window.location.href = form.getAttribute('action');
        });
    </script>
</body>
</html>
