<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="wrapper" >
        <form id="login-form" action="homePage.html">                
            <h1>Login</h1>
            <div class="input-box">
                <input type="text" placeholder="Enter username" id="username" required>
            </div>
            <div class="input-box">
                <input type="password" placeholder="Enter password" id="password" required>
            </div>
            <div id="message-container"></div>
            <div class="remeber-forgot">
                <label><input type="checkbox"> Remeber Me</label>
                <a href="forgotPass.html">Forgot Password?</a>
            </div>
            <button type="submit" class="btn">Login</button>
            <div class="sign-up" >
                <p>Dont have an account? <a href="signup.html">Sign Up</a> </p>
            </div>
        </form>        
    </div>

    <script>
        const form = document.getElementById('login-form');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const messageContainer = document.getElementById('message-container');

        form.addEventListener('submit', function(event) {
            event.preventDefault(); //Prevent default form submission by browser

            const enteredUsername = usernameInput.value;
            const enteredPassword = passwordInput.value;

            const storedUserDataString = localStorage.getItem('userFormData');

            if (storedUserDataString) {
                const storedUserData = JSON.parse(storedUserDataString);
                if (enteredUsername === storedUserData.username && enteredPassword === storedUserData.password) {
                    window.location.href = 'homePage.html';
                } else {
                messageContainer.textContent = 'Incorrect username or password.';
                messageContainer.style.color = 'red';
                }
            } else {
            //Error message for user not found
            messageContainer.textContent = 'No user data found. Please sign up first.';
            messageContainer.style.color = 'red';
            }
        });
    </script>

</body>
</html>
